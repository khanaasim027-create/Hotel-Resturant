async function kotCanvas(k,S){S=S||1;
const W=576,P=24,H=520+(k.items.length+k.cancels.length)*150,c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);
x.fillStyle='#fff';x.fillRect(0,0,W,H);let y=20;
const F=(w,s)=>x.font=`${w} ${s}px Arial, Helvetica, sans-serif`;
const wrap=(t,mw)=>{const out=[];let ln='';String(t).split(' ').forEach(w=>{const tt=ln?ln+' '+w:w;if(x.measureText(tt).width>mw&&ln){out.push(ln);ln=w}else ln=tt});if(ln)out.push(ln);return out};
const ctr=(t,s,w)=>{F(w||'400',s);x.fillStyle='#000';x.textAlign='center';wrap(t,W-2*P).forEach(l=>{y+=s;x.fillText(l,W/2,y);y+=s*.3})};
const dash=()=>{y+=8;x.strokeStyle='#000';x.setLineDash([6,5]);x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();y+=14};
const row=(q,nm,s,note)=>{F('700',s);x.fillStyle='#000';x.textAlign='left';wrap(nm,W-2*P-84).forEach((t,i)=>{y+=s;if(i===0)x.fillText(q,P,y);x.fillText(t,P+84,y);y+=s*.25});
 if(note){F('italic 600',24);wrap('-> '+note,W-2*P-84).forEach(t=>{y+=24;x.fillText(t,P+84,y);y+=6})}y+=12};
ctr(BIZ.name,22,'700');ctr('KOT #'+k.no,46,'700');
if(k.shift){ctr('TABLE SHIFT',34,'700');ctr('TABLE '+k.shift.from+'  ->  TABLE '+k.shift.to,38,'700')}else ctr((k.type||'Dine-in').toUpperCase()+(k.table?' · TABLE '+k.table:''),32,'700');
ctr(new Date(k.time).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})+(k.cust?' · '+k.cust:''),20);dash();
k.items.forEach(l=>row(l.qty+' ×',l.name+(l.size?' ('+l.size+')':''),32,l.note));
if(k.cancels.length){if(k.items.length)dash();ctr('*** CANCELLED ***',28,'700');y+=6;k.cancels.forEach(l=>row(l.qty+' ×','CANCEL: '+l.name+(l.size?' ('+l.size+')':''),28))}
dash();if(!k.shift)ctr('Total items: '+k.items.reduce((a,l)=>a+l.qty,0),22,'700');
const o=document.createElement('canvas');o.width=W*S;o.height=Math.ceil((y+30)*S);const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W*S,o.height);g.drawImage(c,0,0);return o}
