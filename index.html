main{max-width:1200px;margin:0 auto;padding:14px}

.chip{flex:none;background:var(--chip);color:var(--ink);border:0;border-radius:99px;padding:6px 12px;font:500 13px Inter;cursor:pointer}

.pb{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font:600 13px Inter;cursor:pointer;min-width:66px}
.pb:hover{border-color:var(--gold);background:var(--chip)}.pb small{display:block;color:var(--mut);font:500 10px Inter}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}.wrap{overflow-x:auto}
.tot{display:flex;justify-content:space-between;padding:3px 0}.tot.big{font:700 20px Cinzel,serif;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat b{display:block;font:700 22px Cinzel,serif}.stat span{color:var(--mut);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.tag.due{color:var(--red);border-color:var(--red)}.tag.paid{color:var(--ok);border-color:var(--ok)}
.mut{color:var(--mut)}.empty{padding:22px;text-align:center;color:var(--mut)}
.cl{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px;width:92%;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0c2a23;color:#f3e9cf;padding:9px 16px;border-radius:8px;display:none;z-index:9}
#bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);gap:12px;align-items:center}
.x{display:none}
@media(max-width:860px){
.bt #bar{display:flex}.x{display:inline-block}
main{padding:10px 10px 90px}.card{padding:12px}
input,select{font-size:16px}
#list{max-height:none;overflow:visible}
.chips{position:sticky;top:0;z-index:2;background:var(--card);margin:0 -12px;padding:8px 12px}
.btn.sm{padding:8px 13px}
#bcard{display:none}
#bcard.open{display:block;position:fixed;inset:0;z-index:30;overflow:auto;border-radius:0;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
#nob{position:fixed;top:60px;right:8px;width:min(380px,calc(100vw - 16px));z-index:2000;max-height:70vh;overflow:auto}
.bell .bn{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:4px}.bell .bn:empty{display:none}

.ob{pointer-events:auto;background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:12px;padding:10px 12px;margin:0 auto 8px;max-width:560px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:obin .25s ease-out}
@keyframes obin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@media print{header,main,#bar,#toast,.noprint{display:none!important}body{background:#fff;color:#000}dialog{border:0;position:static;max-width:none;width:100%;max-height:none}}

function kotPending(){const items=[],cancels=cx.map(c=>({...c}));
cart.forEach(l=>{const d=l.qty-(l.sent||0);if(d>0)items.push({name:l.name,size:l.size,qty:d,note:l.note||''});else if(d<0)cancels.push({name:l.name,size:l.size,qty:-d})});
return{items,cancels}}
function kotLabel(){if(!cart.length&&!cx.length)return'Send KOT';const p=kotPending(),n=p.items.reduce((a,l)=>a+l.qty,0)+p.cancels.reduce((a,l)=>a+l.qty,0);return n?'Send KOT ('+n+')':'KOT sent ✓'}
function noteDlg(i){const l=cart[i];if(!l)return;const d=$('#dlg');d.style.maxWidth='';
d.innerHTML=`<h3>${esc(l.name)}</h3><p><input id="nt" maxlength="60" placeholder="Kitchen note (jaise: kam teekha, bina pyaaz)" value="${esc(l.note||'')}"></p><div class="chips" id="nq" style="position:static;margin:0 0 10px;padding:0">${['Less spicy','Extra spicy','No onion','No garlic','Parcel'].map(t=>`<button class="chip" data-qn="${t}">${t}</button>`).join('')}</div><div class="row"><button class="btn alt" id="nc">Cancel</button><button class="btn" id="ns">Save note</button></div>`;

async function sendKot(){const p=kotPending();if(!p.items.length&&!p.cancels.length)return toast(cart.length?'No new items. The KOT has already been sent':'Add a dish first');
const t=new Date(),day=t.toLocaleDateString('en-CA');if(!S.kot||S.kot.d!==day)S.kot={d:day,n:0};S.kot.n++;
const k={no:S.kot.n,day,time:t.toISOString(),type:otype,table:cur==='Counter'?'':cur,cust:cust.name.trim(),items:p.items,cancels:p.cancels};
cart.forEach(l=>{l.sent=l.qty});cx=[];S.kots=[k,...(S.kots||[])].slice(0,300);save();cartUI();toast('KOT #'+k.no);await deliverKot(k)}
async function kotCanvas(k,S){S=S||1;
const W=576,P=24,H=520+(k.items.length+k.cancels.length)*150,c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);
x.fillStyle='#fff';x.fillRect(0,0,W,H);let y=20;
const F=(w,s)=>x.font=`${w} ${s}px Arial, Helvetica, sans-serif`;
const wrap=(t,mw)=>{const out=[];let ln='';String(t).split(' ').forEach(w=>{const tt=ln?ln+' '+w:w;if(x.measureText(tt).width>mw&&ln){out.push(ln);ln=w}else ln=tt});if(ln)out.push(ln);return out};
const ctr=(t,s,w)=>{F(w||'400',s);x.fillStyle='#000';x.textAlign='center';wrap(t,W-2*P).forEach(l=>{y+=s;x.fillText(l,W/2,y);y+=s*.3})};
const dash=()=>{y+=8;x.strokeStyle='#000';x.setLineDash([6,5]);x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();y+=14};
const row=(q,nm,s,note)=>{F('700',s);x.fillStyle='#000';x.textAlign='left';wrap(nm,W-2*P-84).forEach((t,i)=>{y+=s;if(i===0)x.fillText(q,P,y);x.fillText(t,P+84,y);y+=s*.25});
 if(note){F('italic 600',24);wrap('-> '+note,W-2*P-84).forEach(t=>{y+=24;x.fillText(t,P+84,y);y+=6})}y+=12};
ctr(BIZ.name,22,'700');ctr('KOT #'+k.no,46,'700');
if(k.shift){ctr('TABLE SHIFT',34,'700');ctr('TABLE '+k.shift.from+'  ->  TABLE '+k.shift.to,38,'700')}else ctr((k.type||'Dine-in').toUpperCase()+(k.table?' · TABLE '+k.table:''),32,'700');
ctr(new Date(k.time).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})+(k.cust?' · '+k.cust:''),20);dash();
k.items.forEach(l=>row(l.qty+' ×',l.name+(l.size?' ('+l.size+')':''),32,l.note));
if(k.cancels.length){if(k.items.length)dash();ctr('*** CANCELLED ***',28,'700');y+=6;k.cancels.forEach(l=>row(l.qty+' ×','CANCEL: '+l.name+(l.size?' ('+l.size+')':''),28))}
dash();if(!k.shift)ctr('Total items: '+k.items.reduce((a,l)=>a+l.qty,0),22,'700');
const o=document.createElement('canvas');o.width=W*S;o.height=Math.ceil((y+30)*S);const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W*S,o.height);g.drawImage(c,0,0);return o}
async function doKot(k){try{await printCv(await kotCanvas(k,window.AndroidBridge?2:1),'KOT-'+k.no)}catch(e){toast('Could not print the KOT')}}
function kotText(k){const B='```',dt=new Date(k.time).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'}),ln=l=>l.qty+' x '+l.name+(l.size?' ('+l.size+')':'');
if(k.shift)return `🔁 *TABLE SHIFT · KOT #${k.no}*\nTable ${k.shift.from} → Table ${k.shift.to}\n${dt}\nKitchen: order naye table pe dena`;
let t=`🍳 *KOT #${k.no}*\n${k.type||'Dine-in'}${k.table?' · Table '+k.table:''}\n${dt}${k.cust?'\n'+k.cust:''}\n`;
if(k.items.length)t+=`${B}\n${k.items.map(l=>ln(l)+(l.note?'\n   -> '+l.note:'')).join('\n')}\n${B}\n`;
if(k.cancels.length)t+=`❌ *CANCELLED*\n${B}\n${k.cancels.map(ln).join('\n')}\n${B}\n`;
return t+`Total items: ${k.items.reduce((a,l)=>a+l.qty,0)}`}
function kotNum(){let p=String((S.kcfg&&S.kcfg.num)||'').replace(/\D/g,'');if(p.length>10&&p.indexOf('91')===0)p=p.slice(2);return p.length===10?p:''}
function kotWa(k){const p=kotNum();if(!p){kotSetup(k);return false}
const ph='91'+p,text=kotText(k);
if(window.AndroidBridge&&AndroidBridge.chat)AndroidBridge.chat(ph,text);else window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(text),'_blank');return true}
async function deliverKot(k){const m=(S.kcfg&&S.kcfg.mode)||'wa';
if(m==='wa'||m==='both'){if(!kotWa(k))return}

 throw new Error(last.slice(0,120))}
async function callAI(d){
 if(GEM_KEY||!window.AI_ENDPOINT)return callGemini(d);
 let r,j;try{r=await fetch(window.AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await AUTH.currentUser.getIdToken()},body:JSON.stringify({image:d,prompt:AI_PROMPT})})}catch(e){throw new Error('Cannot reach AI server. Check the AI_ENDPOINT link ('+String(window.AI_ENDPOINT).slice(0,40)+')')}
 try{j=await r.json()}catch(e){throw new Error('AI server gave a bad reply (status '+r.status+'). Check the Worker code')}
 if(!r.ok)throw new Error((j&&j.error)||('AI server error '+r.status));return j.items}
const srcImg=s=>typeof s==='string'?new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('Could not open the photo'));im.src=s}):loadPhoto(s);
async function readMenu(src){const im=await srcImg(src),w=im.width||im.naturalWidth,h=im.height||im.naturalHeight,tall=h>=w,L=tall?h:w,Sh=tall?w:h,parts=L>1100?(L/Sh>2.2?3:2):1,tiles=[];
 for(let k=0;k<parts;k++){const ov=L*.06,a=Math.max(0,k*L/parts-ov),len=Math.min(L,(k+1)*L/parts+ov)-a,sx=tall?0:a,sy=tall?a:0,sw=tall?w:len,sh=tall?len:h,sc=Math.min(1,2000/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);tiles.push(c.toDataURL('image/jpeg',.85))}
 const all=await Promise.all(tiles.map(callAI)),seen=new Set(),out=[];all.flat().forEach(i=>{if(!i||!i.name)return;const k=String(i.name).toLowerCase().replace(/\s+/g,' ').trim()+'|'+(+i.full||0)+'|'+(i.veg===false?'n':'v');if(!seen.has(k)){seen.add(k);out.push(i)}});return out}
function addItems(items){splitVeg(new Set());let n=0;const touched=new Set();items.forEach(i=>{const name=String(i.name||'').trim();if(!name)return;const raw=String(i.cat||'Menu').trim()||'Menu',cat=vegCat(raw,i.veg!==false),f=+i.full||+i.half||0,h=(+i.half&&+i.full)?+i.half:null;if(S.items.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.cat===cat))return;const it={id:S.nid++,cat,t:isNV(cat)?'n':isV(cat)?'v':(i.veg===false?'n':'v'),name};if(h)it.h=h;it.f=f;S.items.push(it);n++;if(pairable(baseCat(cat)))touched.add(baseCat(cat))});return n+splitVeg(touched)}
const PAIR=/rice|noodle|soup|pasta|chowmein|chop ?suey/i,NOPAIR=/plain|jeera|steam/i,PROT=/chicken|mutton|egg|prawn|fish|keema|paneer|veg|mushroom|corn|potato|cheese|soya|baby/i;
const baseCat=c=>String(c).replace(/^\s*(non[\s-]*veg(etarian)?|veg(etarian)?)\s*[-:]?\s*/i,'').trim()||String(c);
const isNV=c=>/^\s*non[\s-]*veg/i.test(c),isV=c=>!isNV(c)&&/^\s*veg/i.test(c),pairable=c=>PAIR.test(c)&&!NOPAIR.test(c);
function vegCat(cat,veg){const b=baseCat(cat);if(!pairable(b))return cat;return isNV(cat)?'Non-Veg '+b:isV(cat)?'Veg '+b:(veg?'Veg ':'Non-Veg ')+b}
function splitVeg(only){let n=0;S.items.forEach(i=>{const c=vegCat(i.cat,i.t==='v');if(c!==i.cat){i.cat=c;i.t=isNV(c)?'n':'v';n++}});
 const bases=new Set(S.items.filter(i=>pairable(baseCat(i.cat))).map(i=>baseCat(i.cat)));
 bases.forEach(b=>{if(only&&!only.has(b))return;[['Veg '+b,'Non-Veg '+b,'n'],['Non-Veg '+b,'Veg '+b,'v']].forEach(([from,to,tt])=>{S.items.filter(i=>i.cat===from).forEach(i=>{if(PROT.test(i.name))return;if(S.items.some(x=>x.cat===to&&x.name.toLowerCase()===i.name.toLowerCase()))return;const it={id:S.nid++,cat:to,t:tt,name:i.name};if(i.h!=null)it.h=i.h;it.f=i.f;S.items.push(it);n++})})});return n}

async function uploadAll(files){if(!files.length)return;if(BUSY)return toast('Please wait, another task is still running');BUSY=true;let tot=0;

  try{toast('Photo '+tag+' uploading…');const id='p'+Date.now()+Math.random().toString(36).slice(2,6);await phSave({id,data:await compress(f,1800,.8),at:Date.now()})}catch(x){toast('Upload failed: '+((x&&x.message)||'photo or connection issue'));continue}

 BUSY=false;toast('Total '+tot+' items added to the menu ✓')}
async function extractMenu(id){const p=PHOTOS.find(x=>x.id===id);if(!p||BUSY)return;BUSY=true;toast('Re-reading the menu…');try{const n=addItems(await readMenu(p.data));if(n)saveMenu();toast(n?n+' new items added ✓':'No new items found (all are already in the menu)')}catch(x){toast('AI failed: '+((x&&x.message)||x))}BUSY=false}
