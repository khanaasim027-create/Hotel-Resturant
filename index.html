async function phLoad(){try{const d=await phDB(),t=d.transaction('p').objectStore('p');const ks=await new Promise(r=>{const q=t.getAllKeys();q.onsuccess=()=>r(q.result)}),vs=await new Promise(r=>{const q=t.getAll();q.onsuccess=()=>r(q.result)});ks.forEach((k,i)=>PH[k]=vs[i])}catch(e){}}

const thumb=l=>{const it=S.items.find(x=>x.id===parseInt(l.k));return it?`<span class="th">${art(it)}</span>`:''};

document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-ph],[data-pd]');if(a){e.stopPropagation();a.dataset.pd?phSet(+a.dataset.pd,null).then(refreshPh):(phT=+a.dataset.ph);return}if(e.target.closest&&e.target.closest('#th')){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('cd.theme',n)}catch(_){}themeBtn()}},true);

async function phBulk(files){let ok=0;const miss=[],ids=[],L=S.items.map(i=>({i,k:nz(i.name)}));
for(const f of files){const k=nz(f.name);if(!k)continue;let m=L.filter(x=>x.k===k);if(!m.length){const c=L.filter(x=>x.k.length>3&&(k.includes(x.k)||x.k.includes(k)));if(c.length){const best=Math.max(...c.map(x=>x.k.length));m=c.filter(x=>x.k.length===best)}}

async function kotCanvas(k,S){S=S||1;
const W=576,P=24,H=520+(k.items.length+k.cancels.length)*150,c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);
x.fillStyle='#fff';x.fillRect(0,0,W,H);let y=20;
const F=(w,s)=>x.font=`${w} ${s}px Arial, Helvetica, sans-serif`;
const wrap=(t,mw)=>{const out=[];let ln='';String(t).split(' ').forEach(w=>{const tt=ln?ln+' '+w:w;if(x.measureText(tt).width>mw&&ln){out.push(ln);ln=w}else ln=tt});if(ln)out.push(ln);return out};
const ctr=(t,s,w)=>{F(w||'400',s);x.fillStyle='#000';x.textAlign='center';wrap(t,W-2*P).forEach(l=>{y+=s;x.fillText(l,W/2,y);y+=s*.3})};
const dash=()=>{y+=8;x.strokeStyle='#000';x.setLineDash([6,5]);x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();y+=14};
const row=(q,nm,s,note)=>{F('700',s);x.fillStyle='#000';x.textAlign='left';wrap(nm,W-2*P-84).forEach((t,i)=>{y+=s;if(i===0)x.fillText(q,P,y);x.fillText(t,P+84,y);y+=s*.25});
 if(note){F('italic 600',24);wrap('-> '+note,W-2*P-84).forEach(t=>{y+=24;x.fillText(t,P+84,y);y+=6})}y+=12};
ctr(BIZ.name,22,'700');ctr('KOT #'+k.no,46,'700');
if(k.shift){ctr('TABLE SHIFT',34,'700');ctr('TABLE '+k.shift.from+'  ->  TABLE '+k.shift.to,38,'700')}else ctr((k.type||'Dine-in').toUpperCase()+(k.table?' · TABLE '+k.table:''),32,'700');
ctr(new Date(k.time).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})+(k.cust?' · '+k.cust:''),20);dash();
k.items.forEach(l=>row(l.qty+' ×',l.name+(l.size?' ('+l.size+')':''),32,l.note));
if(k.cancels.length){if(k.items.length)dash();ctr('*** CANCELLED ***',28,'700');y+=6;k.cancels.forEach(l=>row(l.qty+' ×','CANCEL: '+l.name+(l.size?' ('+l.size+')':''),28))}
dash();if(!k.shift)ctr('Total items: '+k.items.reduce((a,l)=>a+l.qty,0),22,'700');
const o=document.createElement('canvas');o.width=W*S;o.height=Math.ceil((y+30)*S);const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W*S,o.height);g.drawImage(c,0,0);return o}

if(k.shift)return `🔁 *TABLE SHIFT · KOT #${k.no}*\nTable ${k.shift.from} → Table ${k.shift.to}\n${dt}\nKitchen: order naye table pe dena`;

try{const url=cv.toDataURL('image/png'),mm=Math.ceil(72*cv.height/cv.width)+10,f=document.createElement('iframe');
 f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none';document.body.appendChild(f);
 const w=f.contentWindow,doc=w.document;doc.open();
 doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(name)}</title><style>@page{size:80mm ${mm}mm;margin:0}html,body{margin:0;background:#fff}img{display:block;width:72mm;margin:4mm}</style></head><body><img id="i" src="${url}"></body></html>`);doc.close();

let RD=new Date().toLocaleDateString('en-CA'),RMo=new Date().getMonth(),RY=new Date().getFullYear();
function rep(){const ld=v=>new Date(v.date).toLocaleDateString('en-CA'),sum=a=>a.reduce((x,v)=>x+v.total,0);
const Dd=S.invoices.filter(v=>ld(v)===RD),M=S.invoices.filter(v=>{const d=new Date(v.date);return d.getMonth()===RMo&&d.getFullYear()===RY});
const mn=['January','February','March','April','May','June','July','August','September','October','November','December'],cy=new Date().getFullYear();let y0=cy-4;S.invoices.forEach(v=>{y0=Math.min(y0,new Date(v.date).getFullYear())});const ys=[];for(let y=y0;y<=cy;y++)ys.push(y);
const pm={},top={},days={};M.forEach(v=>{const k=v.paid?v.mode:'Due';pm[k]=(pm[k]||0)+v.total;days[ld(v)]=(days[ld(v)]||0)+v.total;v.lines.forEach(l=>{const k2=l.name+(l.size?' ('+l.size+')':'');top[k2]=(top[k2]||0)+l.qty})});
const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8),dl=Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0]));

<div class="stats"><div class="card stat"><b>${inr(sum(Dd))}</b><span>${isT?'Today':dn} sale (${Dd.length} bills)</span></div><div class="card stat"><b>${inr(sum(M))}</b><span>${mn[RMo]} ${RY} sale (${M.length} bills)</span></div><div class="card stat"><b>${inr(M.length?sum(M)/M.length:0)}</b><span>Average bill this month</span></div><div class="card stat"><b>${inr(sum(M.filter(v=>!v.paid)))}</b><span>Due this month</span></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><h3>Payment split</h3>${Object.keys(pm).length?Object.entries(pm).map(([k,v])=>`<div class="tot"><span>${k}</span><span>${inr(v)}</span></div>`).join(''):'<div class="empty">No sales in this month.</div>'}</div><div class="card"><h3>Top sellers</h3>${tp.length?tp.map(([k,v])=>`<div class="tot"><span>${esc(k)}</span><span>${v} sold</span></div>`).join(''):'<div class="empty">No sales in this month.</div>'}</div><div class="card"><h3>Day by day</h3>${dl.length?dl.map(([k,v])=>`<div class="tot"><span>${new Date(k+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span><span>${inr(v)}</span></div>`).join(''):'<div class="empty">No sales in this month.</div>'}</div></div>`;
$('#rd').onchange=e=>{if(!e.target.value)return;RD=e.target.value;const p=RD.split('-');RY=+p[0];RMo=+p[1]-1;rep()};$('#rmo').onchange=e=>{RMo=+e.target.value;rep()};$('#ry').onchange=e=>{RY=+e.target.value;rep()};$('#rt').onclick=()=>{const n=new Date();RD=n.toLocaleDateString('en-CA');RMo=n.getMonth();RY=n.getFullYear();rep()}}

function fld(f){if(f.h)return `<div class="sdsec">${esc(f.h)}</div>`;const v=f.v===undefined||f.v===null?'':f.v,id='f_'+f.k,hint=f.hint?`<small class="sdhint">${esc(f.hint)}</small>`:'';
 if(f.type==='toggle')return `<label class="sdt"><span><b>${esc(f.l)}</b>${f.hint?`<small>${esc(f.hint)}</small>`:''}</span><input type="checkbox" class="sw" data-k="${f.k}" ${v?'checked':''}></label>`;
 if(f.type==='select')return `<label class="sdl">${esc(f.l)}<select data-k="${f.k}">${f.opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>${hint}</label>`;
 if(f.type==='textarea')return `<label class="sdl">${esc(f.l)}<textarea data-k="${f.k}" rows="${f.rows||4}" placeholder="${esc(f.ph||'')}" maxlength="${f.max||4000}">${esc(v)}</textarea>${hint}</label>`;
 return `<label class="sdl">${esc(f.l)}<input data-k="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal" step="any" min="0"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}" maxlength="${f.max||120}" autocomplete="off">${hint}</label>`}
function sdVals(root){const o={};root.querySelectorAll('[data-k]').forEach(i=>{o[i.dataset.k]=i.type==='checkbox'?i.checked:String(i.value).trim()});return o}
/* Generic editor: o={title,note,fields,save(vals)->string(error)|undefined,hint}  */
function sdForm(o){const e=sdShow(o.title,(o.note?`<div class="sdn">${ic('info',15)}<span>${o.note}</span></div>`:'')+`<div class="sdg">${o.fields.map(fld).join('')}</div>${o.extra||''}`,`<button class="btn alt sm" id="sdx" type="button">Cancel</button><button class="btn sm" id="sds" type="button">${o.saveLabel||'Save'}</button>`);
 $('#sdx').onclick=closeSD;if(o.after)o.after(e);const b=$('#sds');
 b.onclick=async()=>{const v=sdVals(e);b.disabled=true;try{const er=await o.save(v);if(er){erT(er);b.disabled=false;return}okT(o.done||'Saved');closeSD();if(tab==='set')settingsTab()}catch(x){erT((x&&x.message==='slow')?'Slow connection. Please try again':'Could not save: '+((x&&x.message)||x));b.disabled=false}}}
const REQ={email:s=>!s||/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s),gstin:s=>!s||/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(s),fssai:s=>!s||/^\d{14}$/.test(s),phone:s=>!s||!!ph10(s),pct:s=>s===''||(+s>=0&&+s<=100),num:s=>s===''||(+s>=0&&isFinite(+s))};

function legDef(k){const n=bizName(),a=bizAddr();return({
terms:`Welcome to ${n}. By placing an order or using our services you agree to these terms.\n\n1. Prices are shown in Indian Rupees and may change without notice.\n2. Taxes and service charges, where applicable, are added to the bill.\n3. Orders once prepared cannot be changed or cancelled.\n4. We may refuse service in case of misconduct or damage to property.\n5. We reserve the right to update these terms at any time.`,
privacy:`${n} respects your privacy.\n\nWhat we collect: name, phone number and order details that you share with us for billing, delivery and offers.\nHow we use it: to prepare and deliver your order, issue bills and contact you about your order.\nWe never sell your personal information to anyone. Data is stored securely and shared only with delivery or payment partners when needed to complete your order.\nYou can ask us to correct or delete your details at any time by contacting the restaurant.`,
refund:`Cancellation: an order can be cancelled only before the kitchen starts preparing it.\nRefunds: if you receive a wrong, spoilt or missing item, please inform us immediately. We will replace the item or refund its amount.\nOnline payments are refunded to the original payment method within 5 to 7 working days.\nNo refund is possible for food that has been consumed.`,
ship:`Delivery: we deliver within our delivery area, subject to the minimum order value and delivery charge shown at the time of order.\nTiming: delivery time is an estimate and may vary due to traffic, weather or heavy rush.\nPlease share a correct address and a working phone number so that our delivery partner can reach you.\nTakeaway: pick up your order from ${n}${a?', '+a:''}.`,
disc:`Our food is prepared in a kitchen that handles nuts, dairy, gluten, eggs, soy and other allergens. Please tell us about any allergy before ordering.\nImages are for presentation only and the actual dish may vary slightly.\nNutrition and preparation details may change with ingredients and chefs.`,
about:`${n}${a?'\n'+a:''}\n\nWe serve freshly prepared food with care. Thank you for choosing us.`})[k]}

function editHours(){const D=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],h=C().hours||[];
 const rows=D.map((d,i)=>{const r=h[i]||{o:'10:00',c:'22:00',x:false};return `<div class="hr"><b>${d.slice(0,3)}</b><input type="time" data-h="o${i}" value="${r.o}"><span>to</span><input type="time" data-h="c${i}" value="${r.c}"><label class="hx"><input type="checkbox" data-h="x${i}" ${r.x?'checked':''}> Closed</label></div>`}).join('');

function exportPage(){const e=sdShow('Export Restaurant Data',`<div class="sdn">${ic('info',15)}<span>Download your data as CSV files. They open in Excel or Google Sheets.</span></div><div class="sdg"><button class="srow" id="ex1" type="button"><span class="sic">${ic('doc')}</span><span class="stx"><b>Invoices (CSV)</b><small>${(S.invoices||[]).length} bills with date, customer, total, payment</small></span>${ic('down',16)}</button><button class="srow" id="ex2" type="button"><span class="sic">${ic('table')}</span><span class="stx"><b>Menu (CSV)</b><small>${(S.items||[]).length} dishes with category and prices</small></span>${ic('down',16)}</button><button class="srow" id="ex3" type="button"><span class="sic">${ic('store')}</span><span class="stx"><b>Everything (JSON)</b><small>Full backup of menu, settings and invoices</small></span>${ic('down',16)}</button></div>`);
 $('#ex1').onclick=async()=>{try{await dlFile('Invoices-'+stamp()+'.csv',csv([['Invoice','Date','Customer','Phone','Table','Type','Subtotal','Discount','Total','Paid','Mode']].concat((S.invoices||[]).map(v=>[v.no,new Date(v.date).toLocaleString('en-IN'),v.cust,v.phone,v.table,v.otype,v.sub,v.disc,v.total,v.paid?'Yes':'No',v.mode]))),'text/csv');okT('Invoices exported')}catch(x){erT('Could not export')}};
 $('#ex2').onclick=async()=>{try{await dlFile('Menu-'+stamp()+'.csv',csv([['Category','Name','Type','Half price','Full price']].concat((S.items||[]).map(i=>[i.cat,i.name,i.t==='v'?'Veg':'Non-veg',i.h,i.f]))),'text/csv');okT('Menu exported')}catch(x){erT('Could not export')}};
 $('#ex3').onclick=async()=>{try{await dlFile('CityDiner-data-'+stamp()+'.json',JSON.stringify(backupData(),null,1));okT('Data exported')}catch(x){erT('Could not export')}}}
/* help */
const FAQ=[['How do I create a bill?','Open New bill, pick the dishes, enter customer details if needed and press Save. You can print or share the bill from Invoices.'],['How do I send a KOT to the kitchen?','On New bill tap Send KOT. Set the kitchen WhatsApp number and mode in Settings → Order & Kitchen → KOT Settings.'],['How do I add or remove tables?','Go to Settings → Order & Kitchen → Table Management. Enter table names separated by commas and save. Waiter phones update automatically.'],['How do I change the restaurant address or phone?','Settings → Restaurant Profile → Full Address or Contact Number.'],['Can I change the restaurant name or logo?','The name and logo are locked after set-up. Please contact support if you must change them.'],['How do I take a backup?','Settings → Devices & Backup → Data Backup, then Download backup. Keep the file safe.'],['How do I switch between Night and Day?','Use the Night / Day buttons at the top of Settings.'],['My plan has expired. What should I do?','Open Settings → Plan & Subscription and pay monthly or yearly. The plan starts after the admin approves your payment.']];
function helpPage(){sdShow('Help Center',`<div class="sdg">${[['New bill','Pick dishes, add customer name and table, then Save. Mark paid with Cash, UPI or Card.'],['KOT','Send the order to the kitchen on WhatsApp or print it. Cancel or shift tables from the KOT screen.'],['Menu','Add, edit or delete dishes and prices. Changes sync to all waiter phones.'],['Invoices','Open, print, share or edit any old bill. Turn on Edit mode to change bills.'],['Reports','See sales by day and by item.'],['Settings','Everything about your restaurant: profile, tax, kitchen, staff, devices, backup and policies.']].map(([a,b])=>`<div class="hlp"><b>${a}</b><p>${b}</p></div>`).join('')}</div>`)}
function faqPage(){sdShow('Frequently Asked Questions',`<div class="sdg">${FAQ.map(([q,a])=>`<details class="faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>`)}
function supportPage(){const c=cc('support');
 sdForm({title:'Contact Support',note:'Add your software support contact. The buttons below use it. Nothing is shared until you tap a button.',fields:[{k:'wa',l:'Support WhatsApp number',type:'tel',v:c.wa||'',ph:'10 digit number',max:16},{k:'mail',l:'Support email',type:'email',v:c.mail||'',ph:'support@example.com',max:80}],
 extra:`<div class="row" style="margin-top:12px"><button class="btn alt sm" id="spw" type="button">${ic('chat',15)} Message on WhatsApp</button><button class="btn alt sm" id="spm" type="button">${ic('mail',15)} Send email</button></div>`,
 after:e=>{const T='Hello, I need help with the '+bizName()+' POS app ('+APPV+').';$('#spw').onclick=()=>{const p=ph10(e.querySelector('[data-k=wa]').value);if(!p)return erT('Enter a valid support WhatsApp number');openUrl('https://wa.me/91'+p+'?text='+encodeURIComponent(T))};$('#spm').onclick=()=>{const m=e.querySelector('[data-k=mail]').value.trim();if(!REQ.email(m)||!m)return erT('Enter a valid support email');openUrl('mailto:'+m+'?subject='+encodeURIComponent('Support: '+bizName())+'&body='+encodeURIComponent(T))}},
 save:async v=>{if(v.wa&&!ph10(v.wa))return 'Enter a valid 10 digit number';if(!REQ.email(v.mail))return 'Enter a valid email';await cfgSave({support:{wa:v.wa?ph10(v.wa):'',mail:v.mail}},'Updated support contact')}})}
function reportPage(){const sp=cc('support');
 sdForm({title:'Report a Problem',note:'Describe what went wrong. Your report is saved with your settings and can be sent to support.',fields:[{k:'t',l:'What happened?',type:'textarea',rows:6,ph:'Tell us the screen, what you did and what you expected',max:1500}],saveLabel:'Save report',done:'Report saved',
 extra:`<div class="row" style="margin-top:12px"><button class="btn alt sm" id="rpw" type="button">${ic('chat',15)} Send on WhatsApp</button><button class="btn alt sm" id="rpm" type="button">${ic('mail',15)} Send email</button></div>`,
 after:e=>{const T=()=>'Problem report — '+bizName()+'\nApp '+APPV+' · '+(navigator.userAgent||'').slice(0,90)+'\n\n'+e.querySelector('[data-k=t]').value.trim();const chk=()=>{if(e.querySelector('[data-k=t]').value.trim().length<5){erT('Please describe the problem first');return false}return true};
  $('#rpw').onclick=()=>{if(!chk())return;if(!ph10(sp.wa))return erT('Add the support WhatsApp number in Contact Support first');openUrl('https://wa.me/91'+ph10(sp.wa)+'?text='+encodeURIComponent(T()))};
  $('#rpm').onclick=()=>{if(!chk())return;if(!sp.mail)return erT('Add the support email in Contact Support first');openUrl('mailto:'+sp.mail+'?subject='+encodeURIComponent('Problem report: '+bizName())+'&body='+encodeURIComponent(T()))}},
 save:async v=>{if(v.t.length<5)return 'Please describe the problem';const r=(C().reports||[]).slice();r.unshift({t:Date.now(),m:v.t,v:APPV});await cfgSave({reports:r.slice(0,30)},'Reported a problem')}})}
function versionPage(){const bd=(document.querySelector('meta[name=app-build]')||{}).content||'-';
 const row=(a,b)=>`<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`;
 sdShow('App Version',`<div class="sdg">${row('Version',APPV)}${row('Build',bd)}${row('Last cloud sync',C().at?new Date(C().at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'-')}</div><div class="sdn" style="margin-top:12px">${ic('info',15)}<span>The app updates itself when a new version is published. You will see an update message.</span></div>`,`<button class="btn sm" id="cu" type="button" style="flex:1">Check for update</button>`);
 $('#cu').onclick=()=>{if(!updUrl())return erT('Update link is not set. Contact the admin');toast('Checking for updates…');checkUpdate(false).then(()=>{if(!document.getElementById('upd')&&!UPD_BUSY)okT('You have the latest version')})}}
function softPage(){const u=window.AUTH&&AUTH.currentUser,P=PROFILE||{},row=(a,b)=>`<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`;
 sdShow('Software Information',`<div class="sdg">${row('Software','City Diner POS')}${row('Restaurant',bizName())}${row('Account',u?(u.email||u.phoneNumber||'-'):'-')}${row('Plan',isAdmin()?'Admin':(P.plan&&P.plan.expiresAt?(P.plan.expiresAt>8e15?'Lifetime':'Valid till '+new Date(P.plan.expiresAt).toLocaleDateString('en-IN')):'No active plan'))}${row('Menu items',String((S.items||[]).length))}${row('Invoices',String((S.invoices||[]).length))}${row('Language',(LANGS.find(l=>l[0]===LANG)||[0,LANG])[1])}${row('Stored on','Your private cloud account + this device')}</div>`)}
function planPage(){const P=PROFILE,exp=P.plan&&P.plan.expiresAt,lk=LOCKED();
 const e=sdShow('Plan & Subscription',`<div class="sdg"><p style="margin:0 0 10px">${lk?(exp?'Expired on '+new Date(exp).toLocaleDateString('en-IN'):'No active plan'):planLine(P)}</p><div class="row" style="align-items:stretch"><div class="plan"><b>₹300</b>per month<br><button class="btn sm" data-p="monthly" style="margin-top:8px">Pay monthly</button></div><div class="plan"><b>₹3,500</b>per year<br><button class="btn sm" data-p="yearly" style="margin-top:8px">Pay yearly</button></div></div>${payStatus()}</div>`);

function langPage(){sdForm({title:'Language',fields:[{k:'l',l:'App language',type:'select',v:LANG,opts:LANGS.map(([c,n])=>[c,n])}],save:async v=>{await withTO(saveProfile({lang:v.l}));await cfgSave({},'Changed language')}})}

const APPV='v21';
(async()=>{try{if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();if(window.caches)for(const k of await caches.keys())await caches.delete(k)}}catch(e){}})();
const sigOf=window.__sigOf;
const MYSIG=window.__MYSIG||sigOf(document);
var UPD_CFG='',UPD_BUSY=false,NEWHTML='',NEWSIG='',NEWBUILD=0,NEWNOTES='';
const normUrl=u=>{u=String(u||'').trim();const m=/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)$/.exec(u);if(m)return 'https://raw.githubusercontent.com/'+m[1]+'/'+m[2]+'/'+m[3]+'/'+m[4];if(u&&/\/$/.test(u))u+='index.html';return u};
const updUrl=()=>{let u=normUrl(UPD_CFG||window.UPDATE_URL||'');if(!u&&location.protocol.indexOf('http')===0){u=location.href.split('#')[0].split('?')[0];if(u.endsWith('/'))u+='index.html'}return u};
const otaMode=()=>!!(UPD_CFG||window.UPDATE_URL);
const metaOf=(doc,n)=>{const e=doc.querySelector('meta[name="'+n+'"]');return e?(e.getAttribute('content')||''):''};
function showInstalling(){if(document.getElementById('upi'))return;const o=document.createElement('div');o.id='upi';o.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(12,42,35,.96);color:#f3e9cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 16px Inter,sans-serif;text-align:center;padding:20px';o.innerHTML='<div style="font-size:44px">⬇️</div><div>Installing the new update…</div><small style="opacity:.7;font-weight:500">Please wait, the app will restart by itself</small>';document.body.appendChild(o)}
function applyUpdate(){showInstalling();try{sessionStorage.setItem('updTry',String(Date.now()));localStorage.setItem('upd.applied',NEWSIG)}catch(e){}
 setTimeout(async()=>{
  try{localStorage.setItem('justUpdated','1')}catch(e){}
  if(otaMode()&&NEWHTML){
   try{localStorage.setItem('ota.html',NEWHTML);localStorage.setItem('ota.sig',NEWSIG);localStorage.setItem('ota.build',String(NEWBUILD||0));localStorage.removeItem('ota.booting');location.reload();return}
   catch(e){try{['ota.html','ota.sig','ota.build'].forEach(k=>localStorage.removeItem(k))}catch(z){}const o=document.getElementById('upi');if(o)o.remove();try{toast('Update could not be installed (phone storage is full)')}catch(z){}UPD_BUSY=false;return}}
  try{if('serviceWorker' in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  location.replace(location.href.split('#')[0].split('?')[0]+'?u='+Date.now())},700)}
function showUpdate(){if(document.getElementById('upd'))return;const notes=NEWNOTES.split('|').map(x=>x.trim()).filter(Boolean).slice(0,3);const b=document.createElement('div');b.id='upd';b.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:95;background:#12332b;color:#fff;border:1px solid #e3c274;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(0,0,0,.4);font:600 14px Inter,sans-serif';b.innerHTML='<div><div>🔄 A new update is ready</div>'+(notes.length?'<div style="font:500 12px Inter,sans-serif;opacity:.85;margin-top:4px">'+notes.map(x=>'• '+esc(x)).join('<br>')+'</div>':'')+'</div><button id="updb" type="button" style="background:#e3c274;color:#111;border:0;border-radius:8px;padding:10px 14px;font:700 14px Inter,sans-serif;flex:none">Update now</button>';document.body.appendChild(b);document.getElementById('updb').onclick=()=>{const x=document.getElementById('updb');x.disabled=true;x.textContent='Updating…';applyUpdate()}}
async function checkUpdate(first){if(UPD_BUSY)return;try{const u=updUrl();if(!u)return;UPD_BUSY=true;
  const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok){UPD_BUSY=false;return}
  const txt=await r.text();if(txt.indexOf('const APPV')<0||!/<\/html>\s*$/i.test(txt.trim())){UPD_BUSY=false;return}
  const doc=new DOMParser().parseFromString(txt,'text/html');if(!doc.getElementById('app-main')){UPD_BUSY=false;return}
  const sig=sigOf(doc);
  if(sig===MYSIG){UPD_BUSY=false;return}
  try{if(localStorage.getItem('upd.applied')===sig){UPD_BUSY=false;return}}catch(e){}
  NEWHTML=txt;NEWSIG=sig;NEWNOTES=metaOf(doc,'app-notes');NEWBUILD=Math.max(+metaOf(doc,'app-build')||0,+metaOf(document,'app-build')||0);
  let t=0;try{t=+sessionStorage.getItem('updTry')||0}catch(e){}
  if(first&&Date.now()-t>120000)applyUpdate();else{UPD_BUSY=false;showUpdate()}
 }catch(e){UPD_BUSY=false}}
setTimeout(()=>checkUpdate(true),2500);setInterval(()=>checkUpdate(false),300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});
function showWhatsNew(){const notes=metaOf(document,'app-notes').split('|').map(x=>x.trim()).filter(Boolean),d=$('#dlg');d.style.maxWidth='';d.innerHTML='<h3>✅ App updated</h3><p class="mut" style="font-size:13px">You now have the latest version ('+APPV+').</p>'+(notes.length?'<p style="font-weight:600;margin:8px 0 4px">What is new</p><ul style="margin:0 0 12px 18px;padding:0;font-size:14px">'+notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'<button class="btn" style="width:100%" id="wn_ok">OK</button>';if(!d.open)d.showModal();$('#wn_ok').onclick=()=>d.close()}
try{if(localStorage.getItem('justUpdated')){localStorage.removeItem('justUpdated');let n=0;const iv=setInterval(()=>{n++;try{if(PROFILE&&PROFILE.name&&!LOCKED()){clearInterval(iv);showWhatsNew()}else if(n>20)clearInterval(iv)}catch(e){if(n>20)clearInterval(iv)}},1500)}}catch(e){}
try{localStorage.removeItem('ota.booting')}catch(e){}
</script>
<script>
(function(){
 var src=document.getElementById('app-main').text,h='';
 function run(t){var e=document.createElement('script');e.text=t;document.body.appendChild(e)}
 window.__sigOf=function(doc){var a=doc.querySelectorAll('script#app-main,style'),t=[],i;for(i=0;i<a.length;i++)t.push(a[i].textContent);t=t.join('\u0001');var h=5381;for(i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+':'+h};
 try{
  h=localStorage.getItem('ota.html')||'';
  var b=+(localStorage.getItem('ota.build')||0),m=document.querySelector('meta[name="app-build"]'),me=m?(+m.getAttribute('content')||0):0;
  var clr=function(){['ota.html','ota.sig','ota.build','ota.booting'].forEach(function(k){localStorage.removeItem(k)})};
  if(h&&(localStorage.getItem('ota.booting')||b<me)){clr();h=''}
  if(h){
   var d=new DOMParser().parseFromString(h,'text/html'),ms=d.getElementById('app-main');
   if(ms&&d.body){
    localStorage.setItem('ota.booting',String(Date.now()));
    var i,hs=document.head.querySelectorAll('style');for(i=0;i<hs.length;i++)hs[i].remove();
    var ns=d.head.querySelectorAll('style');for(i=0;i<ns.length;i++)document.head.appendChild(document.importNode(ns[i],true));
    document.body.innerHTML=d.body.innerHTML;
    src=ms.text
   }else clr()
  }
 }catch(e){}
 try{window.__MYSIG=window.__sigOf(document)}catch(e){}
 run(src)
})();
</script>
